<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步中心 · 玄鉴</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-collector page-collector-sync">
  <a class="skip-link" href="#content">跳到主要内容</a>
  <div class="app-shell sidebar-collapsed">
    <aside class="app-sidebar" data-od-id="collector-sync-sidebar">
      <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M24 3 40 9v12c0 11-6.7 18.5-16 23-9.3-4.5-16-12-16-23V9L24 3Z"/><circle cx="24" cy="22" r="8"/><path d="M14 22h20M24 12v20m-6-4 12-12"/></svg></span><span class="brand-copy"><strong>玄鉴</strong><span>XUANJIAN INTELLIGENCE</span></span></a>
      <nav class="sidebar-nav" aria-label="主导航" data-od-id="collector-sync-nav"><a class="nav-link active" href="collector-sync.html">同步中心</a></nav>
      <div class="sidebar-footer"></div>
    </aside>
    <button class="sidebar-backdrop" data-sidebar-toggle aria-label="关闭导航"></button>
    <div class="app-stage">
      <header class="app-header" data-od-id="collector-sync-header">
        <button class="btn btn-secondary icon-btn menu-button" data-sidebar-toggle aria-label="打开导航"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="header-actions"><span class="app-version" data-od-id="collector-sync-version">版本 <strong>v20260826</strong></span><button class="avatar" type="button" aria-label="个人账户" data-od-id="collector-sync-account"></button></div>
      </header>

      <main class="app-main collector-main collector-page" id="content" data-collector-surface data-needs-jobs data-od-id="collector-sync-main">
        <section class="collector-pagebar" data-od-id="collector-sync-actions"><div class="collector-page-actions"><button class="btn btn-ghost" data-collector-action="refresh">刷新</button></div></section>

        <section class="domain-summary" data-od-id="collector-sync-summary">
          <div><span>接入源</span><strong class="num">2</strong></div>
          <div><span>漏洞同步</span><strong data-bind="vulnerability-status">未启动</strong></div>
          <div><span>最近漏洞同步</span><strong data-bind="vulnerability-last-sync">—</strong></div>
          <div><span>勒索记录</span><strong class="num" data-bind="ransomware-count">—</strong></div>
          <div><span>勒索来源</span><strong data-bind="ransomware-source">—</strong></div>
          <div><span>接入配置</span><strong data-bind="ransomware-configured">待确认</strong></div>
        </section>

        <section class="sync-surface" data-od-id="collector-sync-pipelines">
          <header class="ops-section-head"><div><span>同步管线</span><h2>来源、调度与输出统一管理</h2></div><small>新增来源时按行扩展</small></header>

          <article class="sync-lane" data-od-id="collector-vulnerability-sync">
            <div class="sync-source"><span class="source-monogram">V</span><div><strong>公开源漏洞</strong><small>标准化漏洞事件</small></div><span class="badge" data-bind="vulnerability-status">未启动</span></div>
            <div class="sync-facts"><span>每次上限<strong class="num">300</strong></span><span>最近同步<strong data-bind="vulnerability-last-sync">—</strong></span></div>
            <div class="sync-controls"><select id="vulnerability-interval" aria-label="漏洞同步间隔"><option value="1">每 1 小时</option><option value="3">每 3 小时</option><option value="6">每 6 小时</option><option value="12">每 12 小时</option><option value="24">每 24 小时</option></select><button class="btn btn-ghost" data-collector-action="vulnerability-run">同步一次</button><button class="btn btn-primary" data-collector-action="vulnerability-start">自动同步</button><button class="btn btn-ghost" data-collector-action="vulnerability-stop">停止</button></div>
          </article>

          <article class="sync-lane" data-od-id="collector-ransomware-sync">
            <div class="sync-source"><span class="source-monogram danger">R</span><div><strong>ransomware.live</strong><small>勒索披露与团伙数据</small></div><span class="badge" data-bind="ransomware-configured">待确认</span></div>
            <div class="sync-facts"><span>同步记录<strong class="num" data-bind="ransomware-count">—</strong></span><span>最近来源<strong data-bind="ransomware-source">—</strong></span></div>
            <div class="sync-controls sync-controls-secret"><input id="ransomware-key" type="password" placeholder="更新 API Key" aria-label="ransomware.live API Key" autocomplete="new-password"><button class="btn btn-secondary" data-collector-action="ransomware-save">保存</button><select id="ransomware-interval" aria-label="勒索同步间隔"><option value="1">每 1 小时</option><option value="3">每 3 小时</option><option value="6">每 6 小时</option><option value="12">每 12 小时</option></select><button class="btn btn-ghost" data-collector-action="ransomware-run">同步一次</button><button class="btn btn-primary" data-collector-action="ransomware-start">自动同步</button><button class="btn btn-ghost" data-collector-action="ransomware-stop">停止</button></div>
          </article>

          <footer class="sync-foot"><span>Bot 推送与监测关键词已归入配置中心，避免运行操作与持久配置混杂。</span><a href="settings.html">打开关键词与通知 →</a></footer>
        </section>
      </main>
    </div>
  </div>
  <div class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
